  @keyframes drift {

    position:relative; margin-top:clamp(22px,4.4vh,44px);
    width:min(92vw,560px); height:clamp(300px,44vh,430px);

  }
  .ph {
    position:absolute; top:0; left:50%;
    width:clamp(150px,40vw,208px);
    padding:7px; border-radius:34px;
    background:linear-gradient(160deg,#2a2a2e 0%,#131316 55%,#232327 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 30px 70px rgba(0,0,0,.72);
    opacity:0; will-change:transform;
  }
  .ph img { display:block; width:100%; border-radius:28px; }
  .ph.c {
    z-index:3;
    box-shadow:0 0 0 1px rgba(255,255,255,.09), 0 34px 80px rgba(0,0,0,.8), 0 0 110px rgba(244,89,91,.20);
    animation: inC .9s cubic-bezier(.22,.9,.3,1) .15s forwards;
  }
  .ph.l { z-index:2; filter:brightness(.82); animation: inL .9s cubic-bezier(.22,.9,.3,1) .3s forwards; }
  .ph.r { z-index:2; filter:brightness(.82); animation: inR .9s cubic-bezier(.22,.9,.3,1) .42s forwards; }
  @keyframes inC { from { opacity:0; transform:translateX(-50%) translateY(46px) scale(.94); }
                   to   { opacity:1; transform:translateX(-50%) translateY(0) scale(1.06); } }
  @keyframes inL { from { opacity:0; transform:translateX(-50%) translateY(40px); }
                   to   { opacity:1; transform:translateX(-124%) translateY(26px) rotate(-9deg); } }
  @keyframes inR { from { opacity:0; transform:translateX(-50%) translateY(40px); }
                   to   { opacity:1; transform:translateX(24%)  translateY(26px) rotate(9deg);  } }

  /* ---- the button ---- */
  .cta-wrap { position:relative; z-index:4; margin-top:clamp(10px,2.6vh,26px);
    display:flex; flex-direction:column; align-items:center; gap:14px;
    opacity:0; animation:rise .8s ease .65s forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  .dl {
    position:relative; display:flex; align-items:center; justify-content:center; gap:14px;
    width:min(86vw,380px); padding:19px 30px; border-radius:999px;
    background:linear-gradient(135deg,#f4595b 0%,#d84044 58%,#b93438 100%);
    color:#fff; text-decoration:none; overflow:hidden;
    box-shadow:0 14px 44px rgba(216,64,68,.42), 0 0 0 1px rgba(255,255,255,.12) inset;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .dl:active { transform:scale(.97); }
  @media (hover:hover) {
    .dl:hover { transform:translateY(-2px);
      box-shadow:0 20px 56px rgba(216,64,68,.55), 0 0 0 1px rgba(255,255,255,.16) inset; }
  }
  .dl::after {  /* silk sheen */
    content:""; position:absolute; top:0; bottom:0; width:52%;
    background:linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.28) 50%, rgba(255,255,255,0) 100%);
    transform:skewX(-20deg); left:-70%;
    animation:sheen 3.6s ease-in-out infinite 1.6s;
  }
  @keyframes sheen { 0%{left:-70%} 42%{left:130%} 100%{left:130%} }
  .dl svg { width:30px; height:30px; flex:none; }
  .dl .t { text-align:left; line-height:1.12; }

  footer a:hover { color:rgba(255,255,255,.6); }

  @media (max-height:640px) {
    .fan { height:250px; }
    .ph { width:132px; }
